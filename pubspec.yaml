dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  share_plus:
  fl_chart: ^0.70.2
  url_launcher: ^6.0.10  # Nếu bạn muốn mở PDF từ URL
  flutter_pdfview: ^1.2.1  # Thư viện để hiển thị PDF trong Flutter
  flutter_image_compress: ^2.1.0
  photo_view:
  wechat_assets_picker:
  photo_manager: ^3.6.4

  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geocoding: ^2.1.0
  location: ^5.0.3
  google_maps_flutter: ^2.12.1
  flutter_polyline_points: ^2.1.0   # hoặc bản mới nhất trên pub.dev


  firebase_core:
  firebase_messaging:

  # Develop
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.9
  carousel_slider: ^5.0.0

  pinput: ^5.0.0
  modal_bottom_sheet: ^3.0.0
  getwidget: ^4.0.0

  font_awesome_flutter:
  google_fonts: ^4.0.4
  universal_platform: ^1.1.0
  shared_preferences: ^2.5.2
  qr_flutter:

  get:
  get_cli:
  get_storage: ^2.1.1
  intl:
  envied:
  flutter_localization: ^0.2.2
  jwt_decoder:
  # The following adds the Cupertino Icons font to your application.
